name: Build & Deploy Platform

# One pipeline for all four apps. Everything — the build matrix, the container
# ports, the Nginx vhosts, the certbot domains — is derived from
# deploy/apps.json, so adding an app means editing that manifest, not this file.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: 'Space-separated app names to deploy (blank = all). e.g. "roas-client roas-server"'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      apps: ${{ steps.plan.outputs.apps }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment plan from deploy/apps.json
        id: plan
        env:
          FILTER: ${{ github.event.inputs.apps }}
        run: |
          set -euo pipefail

          # Collapse whitespace so a blank / spaces-only input means "all apps".
          FILTER="$(printf '%s' "${FILTER:-}" | xargs || true)"

          if [[ -n "$FILTER" ]]; then
            SELECTED="$(jq -c --arg f "$FILTER" '
              ($f | split(" ") | map(select(length > 0))) as $names
              | [.apps[] | select(.name | IN($names[]))]
            ' deploy/apps.json)"
          else
            SELECTED="$(jq -c '.apps' deploy/apps.json)"
          fi

          COUNT="$(jq 'length' <<< "$SELECTED")"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No apps matched '${FILTER}'. Valid names: $(jq -r '[.apps[].name] | join(", ")' deploy/apps.json)"
            exit 1
          fi

          # Flatten to primitives so matrix expressions stay simple; buildArgs
          # rides along as a JSON string and is resolved in the build job.
          MATRIX="$(jq -c \
            --arg ns "$(jq -r '.registry.namespace' deploy/apps.json)" \
            '{include: [.[] | {
                name,
                title,
                image: ($ns + "/" + .image),
                dockerfile,
                buildArgs: (.buildArgs // {} | tojson)
              }]}' <<< "$SELECTED")"

          {
            echo "matrix=${MATRIX}"
            echo "apps=$(jq -r 'map(.name) | join(" ")' <<< "$SELECTED")"
            echo "count=${COUNT}"
          } >> "$GITHUB_OUTPUT"

          echo "Deploying ${COUNT} app(s): $(jq -r 'map(.name) | join(", ")' <<< "$SELECTED")"

  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build args
        id: args
        env:
          BUILD_ARGS_JSON: ${{ matrix.buildArgs }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          # Values written as "@secret:NAME" are looked up in the repo secrets.
          RESOLVED="$(jq -rn \
            --argjson args "$BUILD_ARGS_JSON" \
            --argjson secrets "$ALL_SECRETS" '
              $args
              | to_entries
              | map(
                  .value as $v
                  | if ($v | type) == "string" and ($v | startswith("@secret:"))
                    then .value = ($secrets[$v | ltrimstr("@secret:")] // "")
                    else .
                    end
                )
              | map("\(.key)=\(.value)")
              | join("\n")
            ')"
          {
            echo 'value<<__EOF__'
            echo "$RESOLVED"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root for every image — the apps share packages/common.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------------------
  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight — check required secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail

          # Hard requirements: without these the deploy cannot do anything.
          MISSING=""
          for KEY in SSH_PASSWORD DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            VALUE="$(jq -r --arg k "$KEY" '.[$k] // ""' <<< "$ALL_SECRETS")"
            [[ -z "$VALUE" ]] && MISSING="${MISSING} ${KEY}"
          done
          if [[ -n "$MISSING" ]]; then
            echo "::error::Missing required secret(s):${MISSING}. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # App-level secrets: report rather than block, so a ROAS gap cannot
          # stop the websites from shipping. The affected container will fail
          # its health check and turn the job red on its own.
          ABSENT="$(jq -rn \
            --argjson manifest "$(cat deploy/apps.json)" \
            --argjson secrets "$ALL_SECRETS" '
              ([$manifest.apps[] | (.env // [])[], ((.buildArgs // {}) | to_entries[] | .value)]
                | map(select(type == "string" and contains("@secret:")))
                | map(split("@secret:")[1]))
              | unique
              | map(select(($secrets[.] // "") == ""))
              | join(" ")
            ')"

          if [[ -n "$ABSENT" ]]; then
            echo "::warning::Secrets referenced by deploy/apps.json but not set:${ABSENT}"
            echo "Not set (containers will start without them):${ABSENT}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All secrets referenced by deploy/apps.json are present."
          fi

      - name: Render Nginx configuration
        run: node scripts/render-nginx.mjs

      - name: Stage deployment payload
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          mkdir -p payload
          cp deploy/apps.json payload/
          cp deploy/remote/provision.sh payload/
          cp -r deploy/nginx payload/nginx

          # Every @secret:NAME referenced by the manifest, plus the fixed ones,
          # written to a file so no secret ever lands in the SSH command line.
          jq -rn \
            --argjson manifest "$(cat deploy/apps.json)" \
            --argjson secrets "$ALL_SECRETS" '
              ([$manifest.apps[] | (.env // [])[]]
                | map(select(contains("@secret:")))
                | map(split("@secret:")[1]))
              + ["CERTBOT_EMAIL", "DOCKERHUB_USERNAME", "DOCKERHUB_TOKEN"]
              | unique
              | map(select($secrets[.] != null and $secrets[.] != ""))
              | map("\(.)=\($secrets[.])")
              | join("\n")
            ' > payload/deploy.env
          chmod 600 payload/deploy.env

          echo "payload staged:"
          ls -la payload
          echo "secrets provided: $(cut -d= -f1 payload/deploy.env | tr '\n' ' ')"

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Trust VPS SSH host key
        env:
          REMOTE_HOST: ${{ vars.DEPLOY_HOST || '31.220.49.107' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # ssh-keyscan exits non-zero when the VPS is briefly slow to answer
          # within its default 5s timeout — retry rather than fail the deploy.
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 20 -H "$REMOTE_HOST" > /tmp/vps_known_hosts 2>/dev/null \
              && [ -s /tmp/vps_known_hosts ]; then
              cat /tmp/vps_known_hosts >> ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              echo "Collected SSH host key on attempt ${attempt}."
              exit 0
            fi
            echo "ssh-keyscan attempt ${attempt}/6 returned no host key; retrying in 10s..."
            sleep 10
          done

          echo "::error::Could not retrieve SSH host key for ${REMOTE_HOST}."
          exit 1

      - name: Upload payload and provision VPS
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          REMOTE_HOST: ${{ vars.DEPLOY_HOST || '31.220.49.107' }}
          REMOTE_USER: ${{ vars.DEPLOY_USER || 'root' }}
          IMAGE_TAG: ${{ github.sha }}
          ONLY_APPS: ${{ needs.prepare.outputs.apps }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/opt/print-fast-deploy"

          sshpass -e ssh -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${REMOTE_USER}@${REMOTE_HOST}" "rm -rf ${REMOTE_DIR} && mkdir -p ${REMOTE_DIR}"

          sshpass -e scp -o StrictHostKeyChecking=yes -r \
            payload/. "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_DIR}/"

          sshpass -e ssh -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${REMOTE_USER}@${REMOTE_HOST}" \
            "IMAGE_TAG='${IMAGE_TAG}' ONLY_APPS='${ONLY_APPS}' bash ${REMOTE_DIR}/provision.sh"

      - name: Verify public routes
        env:
          REMOTE_HOST: ${{ vars.DEPLOY_HOST || '31.220.49.107' }}
          ONLY_APPS: ${{ needs.prepare.outputs.apps }}
        run: |
          set -euo pipefail

          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused \
            "http://${REMOTE_HOST}/healthz" >/dev/null
          echo "IP route OK: http://${REMOTE_HOST}/healthz"

          FAILED=0
          for NAME in $ONLY_APPS; do
            DOMAIN="$(jq -r --arg n "$NAME" '.apps[] | select(.name==$n) | .domain' deploy/apps.json)"
            HEALTH="$(jq -r --arg n "$NAME" '.apps[] | select(.name==$n) | .healthPath' deploy/apps.json)"

            DOMAIN_IPS="$(getent ahostsv4 "$DOMAIN" | awk '{print $1}' | sort -u || true)"
            if [[ -z "$DOMAIN_IPS" ]]; then
              echo "::warning::${DOMAIN} has no A record yet — skipping public check."
              continue
            fi
            if ! printf '%s\n' "$DOMAIN_IPS" | grep -Fxq "$REMOTE_HOST"; then
              echo "::warning::${DOMAIN} points at ${DOMAIN_IPS//$'\n'/, }, not ${REMOTE_HOST} — skipping."
              continue
            fi

            if curl -fsS --retry 8 --retry-delay 5 --retry-connrefused \
              "https://${DOMAIN}${HEALTH}" >/dev/null; then
              echo "OK  https://${DOMAIN}${HEALTH}"
            else
              echo "::warning::HTTPS check failed for ${DOMAIN}${HEALTH}"
              FAILED=1
            fi
          done

          exit $FAILED

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| App | Domain | Port | Image |"
            echo "| --- | --- | --- | --- |"
            for NAME in ${{ needs.prepare.outputs.apps }}; do
              jq -r --arg n "$NAME" --arg sha "${{ github.sha }}" \
                '.apps[] | select(.name==$n) | "| \(.name) | https://\(.domain) | \(.hostPort) | \(.image):\($sha[0:7]) |"' \
                deploy/apps.json
            done
          } >> "$GITHUB_STEP_SUMMARY"
