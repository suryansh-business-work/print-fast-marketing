# Generated by scripts/render-nginx.mjs from deploy/apps.json — do not edit by hand.
# marketing.print-fast.com — 301 to the canonical https://print-fast.com
#
# Certbot rewrites this file when it installs TLS, so deploys never overwrite an
# existing copy.

server {
    listen 80;
    listen [::]:80;
    server_name marketing.print-fast.com;

    server_tokens off;

    access_log /var/log/nginx/print-fast-main-alias.access.log;
    error_log  /var/log/nginx/print-fast-main-alias.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://print-fast.com$request_uri;
    }
}
