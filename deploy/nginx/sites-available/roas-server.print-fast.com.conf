# Certbot rewrites this file when it installs TLS (adding the :443 server block
# and the HTTP->HTTPS redirect), so deploys never overwrite an existing copy.
# Routing lives in /etc/nginx/snippets/pf-roas-server.conf and is refreshed every deploy.

server {
    listen 80;
    listen [::]:80;
    server_name roas-server.print-fast.com;

    server_tokens off;

    access_log /var/log/nginx/roas-server.access.log;
