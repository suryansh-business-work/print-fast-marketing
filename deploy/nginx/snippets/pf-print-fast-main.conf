# Generated by scripts/render-nginx.mjs from deploy/apps.json — do not edit by hand.
# Marketing website — proxied to the container on 127.0.0.1:9000.

client_max_body_size 10M;

# Let's Encrypt HTTP-01 challenge must stay reachable over plain HTTP.
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
}

# Legacy shop URLs used to live under the marketing domain. Keep the 301 so ranking and old links survive the split.
location ~ ^/shop-print-fast/?(.*)$ {
    return 301 https://shop.print-fast.com/$1;
}

location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 90s;
}
