# Generated by scripts/render-nginx.mjs from deploy/apps.json — do not edit by hand.
# ROAS dashboard (UI) — proxied to the container on 127.0.0.1:9002.

client_max_body_size 25M;

# Let's Encrypt HTTP-01 challenge must stay reachable over plain HTTP.
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
}


location / {
    proxy_pass http://127.0.0.1:9002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 90s;
}
